name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly Monday 04:17 UTC — out of business hours, low CI contention.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Writing the results to code scanning is the only write this workflow needs:
    # granted to this job alone, not to the whole workflow.
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: java
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build with Maven
        run: mvn -B -ntp install -DskipTests -Pcomplete-win-jar

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          category: "/language:java"
